[project]
name = "text2sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavan", email = "pavanprajapati37178@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "sqlglot>=30.25.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "transformers>=5.22.0",
    "trl>=1.17.0",
]
